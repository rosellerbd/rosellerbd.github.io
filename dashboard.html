<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account — Roseller</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" sizes="64x64" href="images/roseller-logo-64x64-transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* ---------- Account layout ---------- */
    .account-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
      margin: 24px 0 60px;
    }
    .account-sidebar {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 0;
      position: sticky;
      top: 170px;
      align-self: start;
      height: fit-content;
    }
    .account-sidebar-user {
      padding: 0 18px 14px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 8px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .account-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; flex-shrink: 0;
      object-fit: cover;
    }
    .account-sidebar-user strong {
      font-size: 13px; font-weight: 700; display: block;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .account-sidebar-user span {
      font-size: 11.5px; color: var(--muted); display: block;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .account-nav { display: flex; flex-direction: column; }
    .account-nav-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 18px; font-size: 13.5px; font-weight: 500;
      color: var(--ink); text-decoration: none;
      background: none; border: none; cursor: pointer; text-align: left;
      font-family: inherit;
      border-left: 3px solid transparent;
      transition: background .15s, color .15s;
    }
    .account-nav-btn:hover { background: #f9fafb; color: var(--primary); }
    .account-nav-btn.active {
      background: var(--primary-light);
      color: var(--primary-dark);
      border-left-color: var(--primary);
      font-weight: 700;
    }
    .account-nav-btn .ac-icon { font-size: 16px; width: 20px; text-align: center; }
    .account-nav-signout {
      margin-top: 8px; border-top: 1px solid var(--line); padding-top: 12px;
      color: var(--primary);
    }
    .account-content h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
    .account-content .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

    .stat-mini-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px;
    }
    .stat-mini {
      background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px;
      position: relative; overflow: hidden;
    }
    .stat-mini::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--primary);
    }
    .stat-mini.amber::before  { background: #f59e0b; }
    .stat-mini.green::before  { background: #10b981; }
    .stat-mini.purple::before { background: #8b5cf6; }
    .stat-mini-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; margin-bottom: 6px; }
    .stat-mini-value { font-size: 22px; font-weight: 800; }

    .order-history-card {
      background: #fff; border: 1px solid var(--line); border-radius: 8px;
      padding: 14px; margin-bottom: 10px;
    }
    .order-history-card .oh-head {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
    }
    .order-history-card h3 { margin: 0; font-size: 14px; font-weight: 700; }
    .order-history-card .oh-meta { font-size: 12px; color: var(--muted); }
    .order-history-card .oh-items {
      font-size: 12.5px; color: var(--muted); padding: 8px 0;
      border-top: 1px solid var(--line);
    }
    .order-history-card .oh-total {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 8px; border-top: 1px solid var(--line);
      font-size: 13px;
    }
    .order-history-card .oh-total strong { color: var(--primary); font-size: 15px; }

    .account-empty {
      text-align: center; padding: 48px 20px; color: var(--muted);
      background: #fff; border: 1px dashed var(--line); border-radius: 8px;
    }
    .account-empty .em-icon { font-size: 40px; opacity: 0.5; margin-bottom: 10px; }

    /* ---------- Profile form ---------- */
    .profile-form {
      background: #fff; border: 1px solid var(--line); border-radius: 8px;
      padding: 20px; max-width: 560px;
    }
    .profile-form .form-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .profile-form label { font-size: 12.5px; font-weight: 600; color: #374151; }
    .profile-form input, .profile-form textarea {
      padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
      font-size: 13.5px; font-family: inherit; color: var(--ink); resize: vertical;
    }
    .profile-form input:focus, .profile-form textarea:focus {
      outline: 2px solid var(--primary); outline-offset: 1px;
      border-color: var(--primary);
    }
    .profile-form .form-actions { display: flex; gap: 10px; margin-top: 10px; }

    /* ---------- Responsive ---------- */
    @media (max-width: 900px) {
      .account-layout { grid-template-columns: 1fr; }
      .account-sidebar { position: static; top: auto; }
      .stat-mini-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div data-include="partials/header.html"></div>

  <div class="container">
    <div class="page-head">
      <nav class="breadcrumb">
        <a href="index.html">Home</a><span class="crumb-sep">/</span>
        <span class="crumb-current">My Account</span>
      </nav>
      <h1>My Account</h1>
    </div>

    <div id="account-root"></div>
  </div>

  <div data-include="partials/footer.html"></div>

  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/products-loader.js"></script>
  <script src="assets/js/bootstrap.js"></script>

  <script type="module" src="assets/js/cart-db.js"></script>
  <script type="module" src="assets/js/wishlist-db.js"></script>
  <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
